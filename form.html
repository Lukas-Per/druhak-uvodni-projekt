        <h1>Formulář</h1>
        <form class="needs-validation" method="post">

            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="name" id="name" placeholder="Jméno" required>

            <div class="form-floating mb-3">

            </div>
            <div class="mb-3 form-floating">

                <label for="date">Datum</label>
            </div>
            <div class="mb-3 form-floating">
                <input type="file" class="form-control" id="file" name="file" placeholder="file" required>
                <label for="file">Soubor</label>
            </div>
            <div class="mb-3">
                <label for="select-state">Vyberte</label>
                <select id="select-state" class="form-control" name="state[]" multiple placeholder="Select a state..."
                    autocomplete="off">
                    <option value="" disabled selected>Select a state...</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>

                </select>


            </div>

            <div class="mb-3 form-floating">

                <select class="form-select" id="krajSelect" required>
                    <option value="" disabled selected>Vyberte kraj...</option>
                    <option value="hlavni-mesto-praha">Hlavní město Praha</option>
                    <option value="stredocesky">Středočeský kraj</option>
                    <option value="jihocesky">Jihočeský kraj</option>
                    <option value="plzensky">Plzeňský kraj</option>
                    <option value="karlovarsky">Karlovarský kraj</option>
                    <option value="ustecky">Ústecký kraj</option>
                    <option value="liberecky">Liberecký kraj</option>
                    <option value="kralovehradecky">Královéhradecký kraj</option>
                    <option value="pardubicky">Pardubický kraj</option>
                    <option value="vysocina">Kraj Vysočina</option>
                    <option value="jihomoravsky">Jihomoravský kraj</option>
                    <option value="olomoucky">Olomoucký kraj</option>
                    <option value="zlinksy">Zlínský kraj</option>
                    <option value="moravskoslezsky">Moravskoslezský kraj</option>
                </select>
                <label for="krajSelect">Vyberte si oblíbené auto:</label>
            </div>


            <textarea id="default" required">Hello, World!</textarea>

            <button type="submit" class="btn btn-primary">Odeslat a otestovat</button>


            
        </form>

    <script>
        tinymce.init({
            selector: '#default',
            license_key: 'gpl', // Specifikace bezplatné GPL licence

            // Lokální konfigurace cest (nutné pro správné načtení z node_modules)
            suffix: '.min',
            base_url: 'node_modules/tinymce',

            // Odstranění tlačítka "Get all features" / "Upgrade"
            promotion: false,

            // Aktivace potřebných pluginů (tabulky, seznamy, obrázky)
            plugins: 'table lists image',

            // Nastavení lišty s nástroji (přesně podle požadavků)
            toolbar: 'bold italic underline | alignleft aligncenter alignright alignjustify | bullist numlist | table | image',

            // Konfigurace pro upload obrázků
            image_title: true,
            automatic_uploads: true,
            // Cesta ke skriptu na vašem serveru, který obrázek zpracuje a uloží
            images_upload_url: '/upload-handler.php',

            // Alternativní možnost: Výběr lokálního souboru z disku přes dialogové okno
            file_picker_types: 'image',
            file_picker_callback: function (cb, value, meta) {
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');

                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();

                    reader.addEventListener('load', () => {
                        const id = 'blobid' + (new Date()).getTime();
                        const blobCache = tinymce.activeEditor.editorUpload.blobCache;
                        const base64 = reader.result.split(',')[1];
                        const blobInfo = blobCache.create(id, file, base64);
                        blobCache.add(blobInfo);

                        cb(blobInfo.blobUri(), { title: file.name });
                    });
                    reader.readAsDataURL(file);
                });

                input.click();
            },

            // Nastavení výšky editoru
            height: 400,
            language: 'cs' // Volitelné: vyžaduje stažení češtiny do složky langs
        });
    </script>
